# Baymax, self-hosted:   docker compose up --build        then open  http://localhost:8000
#
# Three steps run in order the first time: download the model file -> give it to Ollama -> start Baymax.
# Everything stays on your computer. Only casual chat can go online, and only if you add API keys to .env.
#
# Before the first run:  cp env.example .env   (and read the "Docker" part of README.md)

name: baymax

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Step 1: download the fine-tuned model file (once; it is kept in the "models" volume).
  model-fetch:
    image: curlimages/curl:8.10.1
    user: "0"
    volumes:
      - models:/models
      # If you already have outputs/baymax-q4.gguf, this copies it instead of downloading.
      # The folder is empty on a fresh clone; Docker creates it automatically.
      - ./outputs:/local-model:ro
    environment:
      BAYMAX_GGUF_URL: ${BAYMAX_GGUF_URL:-https://huggingface.co/kartik13906/baymax-gguf/resolve/main/baymax-q4_k_m.gguf}
      BAYMAX_GGUF_SHA256: ${BAYMAX_GGUF_SHA256:-}
      BAYMAX_GGUF_LOCAL: ${BAYMAX_GGUF_LOCAL:-/local-model/baymax-q4.gguf}
      # Only needed when BAYMAX_GGUF_URL points at a private Hugging Face repo.
      HF_TOKEN: ${HF_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -s /models/baymax.gguf ]; then echo "Model file already downloaded."; exit 0; fi
        if [ -s "$$BAYMAX_GGUF_LOCAL" ]; then
          echo "Using the local model file at $$BAYMAX_GGUF_LOCAL ..."
          cp "$$BAYMAX_GGUF_LOCAL" /models/baymax.gguf.part
        else
          if [ -z "$${BAYMAX_GGUF_URL:-}" ]; then
            echo "No local model found and BAYMAX_GGUF_URL is empty." >&2
            echo "Put baymax-q4.gguf in ./outputs/ or set BAYMAX_GGUF_URL in .env." >&2
            exit 1
          fi
          echo "Downloading the Baymax model (about 1 GB, once) ..."
          if [ -n "$${HF_TOKEN:-}" ]; then
            curl -fL --retry 5 --retry-delay 3 -H "Authorization: Bearer $$HF_TOKEN" \
              -o /models/baymax.gguf.part "$$BAYMAX_GGUF_URL" || {
                echo "Download failed. If the model repo is private, set HF_TOKEN in .env." >&2
                echo "Or put outputs/baymax-q4.gguf on this machine; it will be used instead." >&2
                exit 1
              }
          else
            curl -fL --retry 5 --retry-delay 3 -o /models/baymax.gguf.part "$$BAYMAX_GGUF_URL" || {
              echo "Download failed. If the model repo is private, set HF_TOKEN in .env." >&2
              echo "Or put outputs/baymax-q4.gguf on this machine; it will be used instead." >&2
              exit 1
            }
          fi
        fi
        if [ -n "$$BAYMAX_GGUF_SHA256" ]; then
          echo "$$BAYMAX_GGUF_SHA256  /models/baymax.gguf.part" | sha256sum -c -
        fi
        mv /models/baymax.gguf.part /models/baymax.gguf
        echo "Done."
    restart: "no"

  # Step 2: register that file with Ollama under the name "baymax", using the repo's Modelfile
  # (the chat template and the system prompt the model was trained with).
  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
      model-fetch:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - models:/models:ro
      - ./Modelfile:/Modelfile.src:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ollama list | grep -q '^baymax'; then echo "Model 'baymax' already registered."; exit 0; fi
        sed 's#^FROM .*#FROM /models/baymax.gguf#' /Modelfile.src > /tmp/Modelfile
        ollama create baymax -f /tmp/Modelfile
    restart: "no"

  # Step 3: Baymax itself.
  baymax:
    build:
      context: .
      args:
        BAYMAX_WHISPER_MODEL: ${BAYMAX_WHISPER_MODEL:-distil-medium.en}
    image: ${BAYMAX_IMAGE:-baymax:local}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    ports:
      # 127.0.0.1 = only this computer. To use it from a phone or another PC, change to "8000:8000",
      # set BAYMAX_TOKEN and BAYMAX_TLS=1 in .env (see README).
      - "${BAYMAX_BIND:-127.0.0.1}:${BAYMAX_PORT:-8000}:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      BAYMAX_MODEL: baymax
      BAYMAX_FALLBACK_MODEL: baymax
      BAYMAX_STT_DEVICE: cpu
      BAYMAX_TOKEN: ${BAYMAX_TOKEN:-}
      BAYMAX_TLS: ${BAYMAX_TLS:-0}
      BAYMAX_MEMORY: ${BAYMAX_MEMORY:-/data/baymax_memory.db}     # set to "off" to remember nothing
      BAYMAX_MAX_SESSIONS: ${BAYMAX_MAX_SESSIONS:-2}
      BAYMAX_IDLE: ${BAYMAX_IDLE:-30}
      BAYMAX_WHISPER_MODEL: ${BAYMAX_WHISPER_MODEL:-distil-medium.en}
      # Defaults are India's numbers; change them for where you live. Empty helpline = generic wording.
      BAYMAX_EMERGENCY_NUMBER: ${BAYMAX_EMERGENCY_NUMBER:-112}
      BAYMAX_CRISIS_HELPLINE: ${BAYMAX_CRISIS_HELPLINE-}
      BAYMAX_LOCAL_FRIEND: ${BAYMAX_LOCAL_FRIEND:-0}
      # Optional online friend chat (casual messages only). Leave empty to keep everything local.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - baymax-data:/data

volumes:
  ollama:
  models:
  baymax-data:
